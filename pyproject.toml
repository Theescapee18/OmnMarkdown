[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnmarkdown"
version = "2.0.0"
description = "批量将多种格式文档转换为 Markdown，支持 Word/PDF/PPT/Excel/TXT，支持图片提取和表格保留"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "YNAU Team"}
]
keywords = ["word", "docx", "pdf", "pptx", "excel", "markdown", "converter", "batch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "python-docx>=0.8.11",
    "Pillow>=9.0",
    "PyMuPDF>=1.23.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
word2md = "word2md.cli:main"
omnmarkdown = "word2md.cli:main"

[project.urls]
Homepage = "https://github.com/Theescapee18/word2md-batch"

[tool.setuptools.packages.find]
where = ["."]
